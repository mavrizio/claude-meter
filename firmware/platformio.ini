; claude-meter firmware — ESP32-2432S028 "Cheap Yellow Display" (2.8" ILI9341 320x240)

[env:cyd]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@9.3.0
    bblanchon/ArduinoJson@7.2.1

build_flags =
    -Os
    ; LVGL: use include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; TFT_eSPI: CYD wiring, no User_Setup.h edits needed
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
